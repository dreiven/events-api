<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>

  <!-- External provider box -->
  <rect x="30" y="30" width="220" height="80" rx="8" fill="#fdf1e7" stroke="#e08e45" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="140" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#a85c17">External Provider</text>
  <text x="140" y="82" text-anchor="middle" font-size="11" fill="#a85c17">XML feed, unreliable</text>
  <text x="140" y="98" text-anchor="middle" font-size="10" fill="#a85c17">/api/events</text>

  <!-- Our service boundary -->
  <rect x="300" y="10" width="650" height="600" rx="10" fill="#f7f9fc" stroke="#b9c4d3" stroke-width="1.5"/>
  <text x="625" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a4a5c">Events API (our service)</text>

  <!-- ProviderClient -->
  <rect x="330" y="55" width="180" height="60" rx="6" fill="#e8f0fe" stroke="#3b6fd6"/>
  <text x="420" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3d7c">ProviderClient</text>
  <text x="420" y="97" text-anchor="middle" font-size="10" fill="#1a3d7c">HTTP + timeouts</text>

  <!-- JAXB model -->
  <rect x="560" y="55" width="180" height="60" rx="6" fill="#e8f0fe" stroke="#3b6fd6"/>
  <text x="650" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3d7c">JAXB Model</text>
  <text x="650" y="97" text-anchor="middle" font-size="10" fill="#1a3d7c">PlanList / BasePlan / Plan / Zone</text>

  <!-- EventMapper -->
  <rect x="330" y="145" width="410" height="55" rx="6" fill="#eafaf1" stroke="#2f9e5c"/>
  <text x="535" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#176b3b">EventMapper</text>
  <text x="535" y="185" text-anchor="middle" font-size="10" fill="#176b3b">filters sell_mode=online, flattens plans, composite id, min/max price</text>

  <!-- EventCacheService -->
  <rect x="330" y="230" width="410" height="70" rx="6" fill="#fff6db" stroke="#c9a227"/>
  <text x="535" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1a">EventCacheService</text>
  <text x="535" y="270" text-anchor="middle" font-size="10" fill="#8a6d1a">scheduled refresh (30s) · upsert, never delete</text>
  <text x="535" y="286" text-anchor="middle" font-size="10" fill="#8a6d1a">on provider failure: skip refresh, keep last data</text>

  <!-- DB -->
  <rect x="330" y="335" width="180" height="65" rx="6" fill="#fdeaea" stroke="#c74848"/>
  <text x="420" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2c2c">Database (H2 file)</text>
  <text x="420" y="377" text-anchor="middle" font-size="10" fill="#8c2c2c">indexed start/end datetime</text>
  <text x="420" y="391" text-anchor="middle" font-size="9" fill="#8c2c2c">persists across restarts</text>

  <!-- EventRepository interface -->
  <rect x="560" y="335" width="180" height="65" rx="6" fill="#f1eafd" stroke="#7c4fd6"/>
  <text x="650" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#4b2a8c">EventRepository</text>
  <text x="650" y="373" text-anchor="middle" font-size="10" fill="#4b2a8c">(interface)</text>
  <text x="650" y="389" text-anchor="middle" font-size="9" fill="#4b2a8c">impl: JpaEventRepository</text>

  <!-- EventSearchService -->
  <rect x="330" y="435" width="410" height="55" rx="6" fill="#eafaf1" stroke="#2f9e5c"/>
  <text x="535" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#176b3b">EventSearchService</text>
  <text x="535" y="475" text-anchor="middle" font-size="10" fill="#176b3b">delegates search(startsAt, endsAt)</text>

  <!-- Controller -->
  <rect x="330" y="520" width="410" height="60" rx="6" fill="#e8f0fe" stroke="#3b6fd6"/>
  <text x="535" y="543" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3d7c">SearchController + GlobalExceptionHandler</text>
  <text x="535" y="562" text-anchor="middle" font-size="10" fill="#1a3d7c">GET /search → {data, error} envelope</text>

  <!-- Client -->
  <rect x="790" y="530" width="140" height="50" rx="8" fill="#f0f0f0" stroke="#888"/>
  <text x="860" y="560" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Client app</text>

  <!-- Arrows -->
  <line x1="250" y1="70" x2="325" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="85" x2="555" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="115" x2="600" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="200" x2="535" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="300" x2="440" y2="333" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="367" x2="555" y2="367" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="400" x2="600" y2="433" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="490" x2="535" y2="518" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="555" x2="785" y2="555" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="330" y="618" font-size="10" fill="#777">Solid arrows = request/data flow. EventRepository is the abstraction swapped when the DB implementation changed.</text>
</svg>
