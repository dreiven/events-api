version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: events-api-db
    environment:
      POSTGRES_DB: events_api
      POSTGRES_USER: events_user
      POSTGRES_PASSWORD: events_pass
    ports:
      - "5432:5432"
    volumes:
      - events-api-data:/var/lib/postgresql/data

volumes:
  events-api-data: